<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Ensemble — Agent workspace</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><p class="eyebrow">ENSEMBLE / LOCAL WORKSPACE</p><h1>Follow the work. Steer the next step.</h1><p data-status role="status">Connecting</p><p data-pause>Loading Agent state</p></header>
<section aria-label="Conversation" data-artifacts class="artifacts" tabindex="0"></section>
<div class="toolbar"><button data-latest>Return to latest</button><button data-auto-speech aria-pressed="false">Auto speech: off</button><button data-cancel-speech>Cancel speech</button></div>
<section class="composer" aria-label="Agent controls"><label for="message">Prompt or correction</label><textarea id="message" data-input rows="3" placeholder="Ask a question, or send a hint while work is running."></textarea><div class="toolbar"><button data-prompt class="primary">Send prompt</button><button data-hint>Send hint</button><button data-interrupt>Interrupt</button></div><p data-notice role="status">Speech starts disabled. Typing holds the next tool admission.</p></section>
</main><script type="module" src="app.js"></script></body></html>
