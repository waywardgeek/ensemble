<style>
/* Companion paperback: 6 × 9 in, no bleed. Keep the shared type and pagination
   rules, but override all page sizes so recto/verso cannot inherit 7 × 10. */
@page        { size: 6in 9in; margin: 0.75in 0.5in 0.75in 0.875in; }
@page :left  { size: 6in 9in; margin: 0.75in 0.875in 0.75in 0.5in; }
@page :right { size: 6in 9in; margin: 0.75in 0.5in 0.75in 0.875in; }
body, table, code, pre { font-size: 11.5pt; }
.dedication p { font-size: 12pt; }
</style>
